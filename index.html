    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --emerald-glow: rgba(16, 185, 129, 0.15);
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: #fafdfb;
        overflow-x: hidden;
      }

      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
          radial-gradient(at 0% 0%, var(--emerald-glow) 0, transparent 50%), 
          radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.05) 0, transparent 50%),
          radial-gradient(at 100% 100%, var(--emerald-glow) 0, transparent 50%),
          radial-gradient(at 0% 100%, rgba(5, 150, 105, 0.05) 0, transparent 50%);
      }

      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      .floating-icon {
        animation: float 6s ease-in-out infinite;
      }

      .floating-icon-delayed {
        animation: float 8s ease-in-out infinite;
        animation-delay: 2s;
      }

      @keyframes focus-ping {
        0% { transform: scale(1.5); opacity: 0.8; }
        100% { transform: scale(1); opacity: 0; }
      }

      .focus-ring {
        animation: focus-ping 0.4s ease-out forwards;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }
    </style>
