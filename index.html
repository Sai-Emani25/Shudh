<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shudh - Pure Ingredient Guardian</title>

  <!-- Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --emerald-glow: rgba(16, 185, 129, 0.12);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #fafdfb;
      margin: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .mesh-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background:
        radial-gradient(at 0% 0%, var(--emerald-glow) 0, transparent 50%),
        radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.05) 0, transparent 50%),
        radial-gradient(at 100% 100%, var(--emerald-glow) 0, transparent 50%),
        radial-gradient(at 0% 100%, rgba(5, 150, 105, 0.05) 0, transparent 50%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>

</head>

<body>
  <div class="mesh-bg"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
