
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <title>Shudh - Pure Ingredient Guardian</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --emerald-glow: rgba(16, 185, 129, 0.15);
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: #fafdfb;
        margin: 0;
        overflow-x: hidden;
      }

      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
          radial-gradient(at 0% 0%, var(--emerald-glow) 0, transparent 50%), 
          radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.05) 0, transparent 50%),
          radial-gradient(at 100% 100%, var(--emerald-glow) 0, transparent 50%),
          radial-gradient(at 0% 100%, rgba(5, 150, 105, 0.05) 0, transparent 50%);
      }

      /* Initial Loader */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      .loader-spin {
        width: 40px;
        height: 40px;
        border: 3px solid #ecfdf5;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #error-diagnostic {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff1f2;
        border: 1px solid #fda4af;
        padding: 12px 20px;
        border-radius: 12px;
        color: #9f1239;
        font-size: 12px;
        font-weight: 600;
        z-index: 2000;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }
    </style>

    <script>
      // Mock process for environmental variables
      window.process = { env: { API_KEY: "" } };
      
      // Error handling for diagnostic purposes
      window.onerror = function(msg, url, line) {
        const diag = document.getElementById('error-diagnostic');
        if (diag) {
          diag.style.display = 'block';
          diag.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${msg} (Line: ${line})`;
        }
      };
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-spin"></div>
      <p style="margin-top: 20px; font-weight: 800; color: #064e3b; letter-spacing: 0.1em; font-size: 11px; text-transform: uppercase;">Clinical Engine Initializing</p>
    </div>

    <div id="error-diagnostic"></div>

    <div class="mesh-bg"></div>
    <div id="root"></div>

    <!-- Data-type module tells Babel to handle imports inside index.tsx -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>
    
    <script>
      // Clean up loader after app mount signal or timeout
      window.addEventListener('load', () => {
        const checkMount = setInterval(() => {
          if (document.querySelector('#root > div')) {
            const loader = document.getElementById('initial-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 500);
            }
            clearInterval(checkMount);
          }
        }, 100);

        // Max wait 8 seconds
        setTimeout(() => clearInterval(checkMount), 8000);
      });
    </script>
  </body>
</html>
